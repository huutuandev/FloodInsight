
name: floodinsight

x-runtime: &runtime
  networks: [floodinsight-internal]
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-python-service: &python-service
  <<: *runtime
  configs:
    - source: python-logging
      target: /etc/floodinsight/logging.json
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).close()"]
    interval: 5s
    timeout: 3s
    retries: 10
    start_period: 10s

x-postgres-environment: &postgres-environment
  POSTGRES_DB: ${POSTGRES_DB:-floodinsight}
  POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}

services:
  ingestion-service:
    <<: *python-service
    build: ./services/ingestion-service
    command: ["python", "-m", "uvicorn", "floodinsight_ingestion.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/floodinsight_ingestion", "--log-config", "/etc/floodinsight/logging.json"]
    volumes:
      - ./services/ingestion-service/floodinsight_ingestion:/app/floodinsight_ingestion:ro
    environment:
      FLOODINSIGHT_INGESTION_ENVIRONMENT: ${FLOODINSIGHT_INGESTION_ENVIRONMENT:-development}
      FLOODINSIGHT_INGESTION_OPEN_METEO_URL: ${FLOODINSIGHT_INGESTION_OPEN_METEO_URL:-https://api.open-meteo.com/v1/forecast}
      FLOODINSIGHT_INGESTION_SCHEDULER_ENABLED: ${FLOODINSIGHT_INGESTION_SCHEDULER_ENABLED:-true}
      FLOODINSIGHT_INGESTION_INTERVAL_SECONDS: ${FLOODINSIGHT_INGESTION_INTERVAL_SECONDS:-300}
      FLOODINSIGHT_INGESTION_TIMEOUT_SECONDS: ${FLOODINSIGHT_INGESTION_TIMEOUT_SECONDS:-12}
      FLOODINSIGHT_INGESTION_MAX_ATTEMPTS: ${FLOODINSIGHT_INGESTION_MAX_ATTEMPTS:-3}
      FLOODINSIGHT_INGESTION_FORECAST_HOURS: ${FLOODINSIGHT_INGESTION_FORECAST_HOURS:-24}
      <<: *postgres-environment
      POSTGRES_HOST: postgres
    ports:
      - "127.0.0.1:${INGESTION_PORT:-8001}:8000"
    depends_on:
      warehouse-migrate:
        condition: service_completed_successfully

  warehouse-migrate:
    <<: *runtime
    build: ./services/warehouse-service
    command: ["alembic", "upgrade", "head"]
    volumes:
      - ./services/warehouse-service/migrations:/app/migrations:ro
    environment:
      <<: *postgres-environment
      POSTGRES_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy

  warehouse-service:
    <<: *python-service
    build: ./services/warehouse-service
    command: ["python", "-m", "uvicorn", "floodinsight_warehouse.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/floodinsight_warehouse", "--log-config", "/etc/floodinsight/logging.json"]
    volumes:
      - ./services/warehouse-service/floodinsight_warehouse:/app/floodinsight_warehouse:ro
      - ./services/warehouse-service/migrations:/app/migrations:ro
    environment:
      FLOODINSIGHT_WAREHOUSE_ENVIRONMENT: ${FLOODINSIGHT_WAREHOUSE_ENVIRONMENT:-development}
      FLOODINSIGHT_WAREHOUSE_ARCHIVE_URL: ${FLOODINSIGHT_WAREHOUSE_ARCHIVE_URL:-https://archive-api.open-meteo.com/v1/archive}
      FLOODINSIGHT_WAREHOUSE_ARCHIVE_ATTEMPTS: ${FLOODINSIGHT_WAREHOUSE_ARCHIVE_ATTEMPTS:-3}
      FLOODINSIGHT_WAREHOUSE_ARCHIVE_TIMEOUT_SECONDS: ${FLOODINSIGHT_WAREHOUSE_ARCHIVE_TIMEOUT_SECONDS:-30}
      <<: *postgres-environment
      POSTGRES_HOST: postgres
    ports:
      - "127.0.0.1:${WAREHOUSE_PORT:-8002}:8000"
    depends_on:
      warehouse-migrate:
        condition: service_completed_successfully

  forecast-refresh:
    <<: *runtime
    build: ./services/warehouse-service
    command: ["python", "/app/scripts/ingest_multimodel_and_ground_gauges.py", "--interval-seconds", "${FLOODINSIGHT_FORECAST_REFRESH_SECONDS:-21600}", "--warehouse-url", "http://warehouse-service:8000", "--prediction-url", "http://prediction-service:8000"]
    volumes:
      - ./scripts/ingest_multimodel_and_ground_gauges.py:/app/scripts/ingest_multimodel_and_ground_gauges.py:ro
    environment:
      <<: *postgres-environment
      POSTGRES_HOST: postgres
      PYTHONPATH: /app
    depends_on:
      warehouse-migrate:
        condition: service_completed_successfully
      warehouse-service:
        condition: service_healthy
      prediction-service:
        condition: service_healthy

  analysis-service:
    <<: *python-service
    build: ./services/analysis-service
    command: ["python", "-m", "uvicorn", "floodinsight_analysis.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/floodinsight_analysis", "--log-config", "/etc/floodinsight/logging.json"]
    volumes:
      - ./services/analysis-service/floodinsight_analysis:/app/floodinsight_analysis:ro
    environment:
      FLOODINSIGHT_ANALYSIS_ENVIRONMENT: ${FLOODINSIGHT_ANALYSIS_ENVIRONMENT:-development}
      <<: *postgres-environment
      POSTGRES_HOST: postgres
    ports:
      - "127.0.0.1:${ANALYSIS_PORT:-8003}:8000"
    depends_on:
      warehouse-migrate:
        condition: service_completed_successfully

  clustering-service:
    <<: *python-service
    build:
      context: ./services/clustering-service
      additional_contexts:
        ml_common: ./services/ml-common
    command: ["python", "-m", "uvicorn", "floodinsight_clustering.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/floodinsight_clustering", "--log-config", "/etc/floodinsight/logging.json"]
    volumes:
      - ./services/clustering-service/floodinsight_clustering:/app/floodinsight_clustering:ro
      - clustering-models:/models
    environment:
      FLOODINSIGHT_CLUSTERING_ENVIRONMENT: ${FLOODINSIGHT_CLUSTERING_ENVIRONMENT:-development}
      <<: *postgres-environment
      POSTGRES_HOST: postgres
    ports:
      - "127.0.0.1:${CLUSTERING_PORT:-8004}:8000"
    depends_on:
      warehouse-migrate:
        condition: service_completed_successfully

  prediction-service:
    <<: *python-service
    build:
      context: ./services/prediction-service
      additional_contexts:
        ml_common: ./services/ml-common
    command: ["python", "-m", "uvicorn", "floodinsight_prediction.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/floodinsight_prediction", "--log-config", "/etc/floodinsight/logging.json"]
    volumes:
      - ./services/prediction-service/floodinsight_prediction:/app/floodinsight_prediction:ro
      - prediction-models:/models
    environment:
      FLOODINSIGHT_PREDICTION_ENVIRONMENT: ${FLOODINSIGHT_PREDICTION_ENVIRONMENT:-development}
      <<: *postgres-environment
      POSTGRES_HOST: postgres
    ports:
      - "127.0.0.1:${PREDICTION_PORT:-8005}:8000"
    depends_on:
      warehouse-migrate:
        condition: service_completed_successfully

  classification-service:
    <<: *python-service
    build:
      context: ./services/classification-service
      additional_contexts:
        ml_common: ./services/ml-common
    command: ["python", "-m", "uvicorn", "floodinsight_classification.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/floodinsight_classification", "--log-config", "/etc/floodinsight/logging.json"]
    volumes:
      - ./services/classification-service/floodinsight_classification:/app/floodinsight_classification:ro
      - classification-models:/models
    environment:
      FLOODINSIGHT_CLASSIFICATION_ENVIRONMENT: ${FLOODINSIGHT_CLASSIFICATION_ENVIRONMENT:-development}
      <<: *postgres-environment
      POSTGRES_HOST: postgres
    ports:
      - "127.0.0.1:${CLASSIFICATION_PORT:-8006}:8000"
    depends_on:
      warehouse-migrate:
        condition: service_completed_successfully

  api-service:
    <<: *python-service
    build: ./services/api-service
    command: ["python", "-m", "uvicorn", "floodinsight_api.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/floodinsight_api", "--log-config", "/etc/floodinsight/logging.json"]
    volumes:
      - ./services/api-service/floodinsight_api:/app/floodinsight_api:ro
    environment:
      FLOODINSIGHT_API_ENVIRONMENT: ${FLOODINSIGHT_API_ENVIRONMENT:-development}
      FLOODINSIGHT_API_CORS_ORIGINS: ${FLOODINSIGHT_API_CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      FLOODINSIGHT_API_READ_TIMEOUT: ${FLOODINSIGHT_API_READ_TIMEOUT:-10}
      FLOODINSIGHT_API_PROCESSING_TIMEOUT: ${FLOODINSIGHT_API_PROCESSING_TIMEOUT:-180}
      FLOODINSIGHT_API_PROBE_TIMEOUT: ${FLOODINSIGHT_API_PROBE_TIMEOUT:-4}
      FLOODINSIGHT_API_INGESTION_URL: ${FLOODINSIGHT_API_INGESTION_URL:-http://ingestion-service:8000}
      FLOODINSIGHT_API_WAREHOUSE_URL: ${FLOODINSIGHT_API_WAREHOUSE_URL:-http://warehouse-service:8000}
      FLOODINSIGHT_API_ANALYTICS_URL: ${FLOODINSIGHT_API_ANALYTICS_URL:-http://analysis-service:8000}
      FLOODINSIGHT_API_CLUSTERING_URL: ${FLOODINSIGHT_API_CLUSTERING_URL:-http://clustering-service:8000}
      FLOODINSIGHT_API_PREDICTION_URL: ${FLOODINSIGHT_API_PREDICTION_URL:-http://prediction-service:8000}
      FLOODINSIGHT_API_CLASSIFICATION_URL: ${FLOODINSIGHT_API_CLASSIFICATION_URL:-http://classification-service:8000}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"

  frontend:
    <<: *runtime
    build:
      context: ./frontend
      target: development
    environment:
      FLOODINSIGHT_API_URL: http://api-service:8000
      WATCHPACK_POLLING: "1000"
    volumes:
      - ./frontend/app:/app/app:ro
    depends_on:
      api-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(response => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 10
      start_period: 20s
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"

  postgres:
    <<: *runtime
    image: postgres:16
    environment: *postgres-environment
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - PGPASSWORD="$$POSTGRES_PASSWORD" psql -w -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -tAc 'SELECT 1' >/dev/null
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 15s

configs:
  python-logging:
    file: ./config/python-logging.json

networks:
  floodinsight-internal:
    driver: bridge

volumes:
  postgres-data:
  classification-models:
  prediction-models:
  clustering-models:
